# Convergence test (single realization) — variant of fiducial.toml
# Fiducial experiment: EdS background, Planck18 spectral shape (σ8 = 0.8105 at D = 1).
# Long modes |k| < k_split shared; the UV member adds the band k_split ≤ |k| < k_uv.
name = "conv_pm384m2s400"
L = 500.0            # Mpc/h
N_ic = 256           # white-noise grid defining each realization (embedded into finer grids)
k_split = 0.2        # h/Mpc
k_uv = 1.2           # h/Mpc
k_store = 0.25       # store Fourier modes with |k| ≤ k_store
epochs = [0.02, 0.05, 0.075, 0.1, 0.125, 0.15, 0.175, 0.2, 0.225, 0.25, 0.275, 0.3, 0.35, 0.4,
          0.45, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]   # D = a (EdS)

[lpt]
N = 256
n_max = 7
mode = "fast"

[pm]
N = 384
res_pm = 768
n_steps = 400        # uniform in D over [D_ini, 1]
D_ini = 0.02
ic_order = 3
ic_mode = "lean"
worder = 2           # CIC
grad_kernel_order = 4
deconvolve = false
antialias = 0

[seeds]
long = [1]
short = [1001]
signs = [1]
