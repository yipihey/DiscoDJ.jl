# Publish the study reports to GitHub Pages via the gh-pages branch, whenever a report or its figures change on main:
#   /                               LPT vs N-body report (studies/lpt_pdf/report.html + figures)
#   /studies/eft_shell_crossing/    EFT / shell-crossing study (rendered from its README.md + figures)
name: Report on GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "studies/lpt_pdf/report.html"
      - "studies/lpt_pdf/build_site.sh"
      - "studies/lpt_pdf/figures/**"
      - "studies/lpt_pdf/copula/figures/**"
      - "studies/lpt_pdf/sheet_pdf/figures/**"
      - "studies/eft_shell_crossing/README.md"
      - "studies/eft_shell_crossing/build_site.py"
      - "studies/eft_shell_crossing/reports/**"
      - "studies/eft_shell_crossing/figures/**"
      - ".github/workflows/report-pages.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: report-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: studies/lpt_pdf/build_site.sh _site
      - run: python3 -m pip install --quiet markdown
      - run: python3 studies/eft_shell_crossing/build_site.py _site/studies/eft_shell_crossing
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish study report"
